[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truestory"
version = "0.1.0"
description = "A fact and rights engine for based on a true story productions, powered by the COVERAGE clearance pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dxt1nction studio" }]
keywords = [
    "clearance",
    "errors-and-omissions",
    "fact-verification",
    "adk",
    "gemini",
    "parallel-web",
    "agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # ── orchestration ───────────────────────────────────────
    "google-cloud-aiplatform[agent_engines,adk]>=1.101.0",
    "google-genai>=1.0.0",

    # ── partner ─────────────────────────────────────────────
    "parallel-web>=0.1.0",

    # ── tool boundary ───────────────────────────────────────
    "mcp>=1.2.0",

    # ── google cloud runtime ────────────────────────────────
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-tasks>=2.16.0",
    "google-cloud-scheduler>=2.13.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-logging>=3.11.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",

    # ── service tier ────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",

    # ── ingest and artifacts ────────────────────────────────
    "pypdf>=5.0.0",
    "reportlab>=4.2.0",
    "jinja2>=3.1.4",

    # ── cli ─────────────────────────────────────────────────
    "typer>=0.12.0",
    "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
truestory = "truestory.cli:app"

[project.urls]
Homepage = "https://github.com/GIND123/True-Story"
Documentation = "https://github.com/GIND123/True-Story/blob/main/docs/ARCHITECTURE.md"

[tool.hatch.build.targets.wheel]
packages = ["src/truestory"]

# =============================================================================
# tooling
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # fastapi dependency injection idiom
    "N818",   # domain exception names do not all end in Error
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
# So the suite runs from a bare clone, before `pip install -e .`.
pythonpath = ["src"]
markers = [
    "live: hits real Parallel or Vertex AI endpoints and costs money",
    "eval: part of the Litigation Set or labelled script evaluation",
    "slow: takes more than five seconds",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/truestory"]
omit = ["*/tests/*", "*/__init__.py"]
