<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Original cinematic light-ray. Near-black ground with a single directional
       beam sweeping from the upper right, teal-led with a warm edge so it does
       not read as one flat colour, plus fine film grain and a deep vignette.
       Built for TRUE STORY; nothing here is from a third-party template. -->
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a171b" stop-opacity="0"/>
      <stop offset="0.40" stop-color="#2ec5b6" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#7fe6da" stop-opacity="0.55"/>
      <stop offset="0.60" stop-color="#e6a06a" stop-opacity="0.22"/>
      <stop offset="0.72" stop-color="#2ec5b6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0a171b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ff0e3" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#2ec5b6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2ec5b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.62" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#04070a" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#04070a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#03060a" stop-opacity="0.98"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#05080b"/>

  <!-- the beam: a narrow directional sweep, blurred into light not shape -->
  <g filter="url(#soft)" transform="rotate(32 1040 300)">
    <rect x="900" y="-500" width="150" height="1900" fill="url(#beam)"/>
    <rect x="1080" y="-500" width="70" height="1900" fill="url(#beam)" opacity="0.6"/>
    <rect x="760" y="-500" width="46" height="1900" fill="url(#beam)" opacity="0.45"/>
  </g>

  <!-- the hotspot where the beam is brightest -->
  <ellipse cx="1120" cy="200" rx="440" ry="300" fill="url(#flare)"/>

  <!-- grain and a deep vignette to seat it in near-black -->
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.65"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
