  - id: LS-202
    name: "Ringgold v. Black Entertainment Television, Inc."
    side: plaintiff
    court: "U.S. Court of Appeals for the Second Circuit"
    docket_number: "96-9329"
    citation: "126 F.3d 70"
    decision_date: "1997-09-16"
    procedural_posture: "Published opinion reversing summary judgment for the television defendants."
    outcome: "Summary judgment was reversed and the copyright claim remanded."
    holding: >
      Repeated, observable display of copyrighted artwork as set decoration
      crossed the de minimis threshold; fair use required further proceedings.
    lesson: >
      Brief background visibility does not itself clear artwork. Duration,
      focus, prominence, purpose, and licensing markets must be reviewed.
    issues:
      - "copyrighted artwork as set decoration"
      - "background poster"
      - "brief screen visibility"
      - "de minimis copying"
      - "fair use"
    shape:
      kind: element
      element_type: ARTWORK_VISUAL
