  - id: LS-101
    name: "Louis Vuitton Malletier S.A. v. Warner Bros. Entertainment Inc."
    side: defence
    court: "U.S. District Court for the Southern District of New York"
    docket_number: "1:11-cv-09436-ALC-HBP"
    citation: "868 F. Supp. 2d 172"
    decision_date: "2012-06-15"
    procedural_posture: "Opinion and order granting Warner Bros.' motion to dismiss."
    outcome: "The Lanham Act, dilution, and unfair-competition claims were dismissed."
    holding: >
      The bag's use in The Hangover Part II had artistic relevance and was not
      explicitly misleading, so the expressive use was protected under Rogers.
    lesson: >
      A real mark in a film is not automatically a block; artistic relevance
      and explicit misleadingness must be surfaced for counsel.
    issues:
      - "trademark in expressive work"
      - "fictional character identifies luxury bag"
      - "artistic relevance"
      - "explicitly misleading"
    shape:
      kind: element
      element_type: TRADEMARK_LOGO
    courtlistener:
