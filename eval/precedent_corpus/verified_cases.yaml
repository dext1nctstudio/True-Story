  - id: LS-003
    name: "Fairstein v. Netflix, Inc."
    side: plaintiff
    court: "U.S. District Court for the Southern District of New York"
    docket_number: "1:20-cv-08042-PKC"
    citation: "2023 WL 6164291"
    decision_date: "2023-09-19"
    procedural_posture: "Opinion and order denying defendants' motion for summary judgment."
    outcome: "Defendants' summary-judgment motion was denied; plaintiff's sanctions and strike motions were also denied."
    holding: >
      A jury could find several scenes conveyed defamatory facts and could
      consider conflicts between the dramatization and production sources.
    lesson: >
      The record must be examined scene by scene: documented chronology,
      attributed conduct, knowledge, intent, and motive carry different burdens.
    issues:
      - "withholding DNA evidence"
      - "coercing confessions"
      - "attributed prosecutorial conduct"
      - "source material conflicts"
      - "intentional misconduct"
    shape:
