  - id: LS-104
    name: "Sarver v. Chartier"
    side: defence
    court: "U.S. Court of Appeals for the Ninth Circuit"
    docket_number: "11-56986, 12-55429"
    citation: "813 F.3d 891"
    decision_date: "2016-02-17"
    procedural_posture: "Published opinion affirming dismissal under California's anti-SLAPP statute."
    outcome: "Dismissal of the claims concerning The Hurt Locker was affirmed."
    holding: >
      The film addressed a matter of public concern and was protected
      expressive speech; Sarver also failed to establish his defamation claim.
    lesson: >
      Identifiability and fictionalization are inputs to review, not automatic
      liability; the forum and protected-speech analysis can be dispositive.
    issues:
      - "real person's professional identity"
      - "fictionalized film character"
      - "matter of public concern"
      - "right of publicity"
      - "defamation"
    shape:
