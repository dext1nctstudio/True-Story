  - id: LS-103
    name: "De Havilland v. FX Networks, LLC"
    side: defence
    court: "California Court of Appeal, Second Appellate District"
    docket_number: "B285629"
    citation: "21 Cal. App. 5th 845"
    decision_date: "2018-03-26"
    procedural_posture: "Opinion reversing denial of defendants' anti-SLAPP motion."
    outcome: "The appellate court directed the trial court to grant the anti-SLAPP motion and strike the complaint."
    holding: >
      Feud was protected expressive speech; realistic portrayal and invented
      dialogue did not by themselves remove First Amendment protection.
    lesson: >
      A departure from the historical record should be flagged, but that flag
      is not a legal conclusion that the portrayal is actionable.
    issues:
      - "invented dialogue"
      - "fictitious interview"
      - "real public figure in docudrama"
      - "transformative use"
      - "anti-SLAPP"
    shape:
      kind: person_rollup
      element_type: REAL_PERSON_DEPICTED
      polarity: negative
      subject_alive: true
      named: true
    courtlistener:
