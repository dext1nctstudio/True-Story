    element_type: 4
    claim_type: 2
    polarity: 2
    subject_alive: 2
    named: 2
    kind: 1
    truth_claim_framing: 1
    semantic_overlap: 2
  min_score: 4
  max_matches_per_finding: 3
  both_sides_always: true

cases:
  - id: LS-001
    name: "Gaprindashvili v. Netflix, Inc."
    side: plaintiff
    court: "U.S. District Court for the Central District of California"
    docket_number: "2:21-cv-07408-VAP-SK"
    citation: "2022 WL 363537"
    decision_date: "2022-01-27"
    procedural_posture: "Order denying Netflix's Rule 12(b)(6) motion and anti-SLAPP motion."
    outcome: "Netflix's motion to dismiss and anti-SLAPP motion were denied."
    holding: >
      A fictional series was not categorically insulated from a defamation
      claim about a real person, and the pleaded record supported proceeding.
    lesson: >
      A single named, time-bounded historical assertion can justify escalation
      when readily available records say the opposite.
    issues:
      - "historical achievement"
      - "never faced male chess players"
      - "real person named in fictional series"
      - "source material contradicted screenplay"
    shape:
      kind: claim
      element_type: REAL_PERSON_DEPICTED
      claim_type: ACHIEVEMENT
      polarity: negative
      subject_alive: true
      named: true
      project_truth_claim_framing: false
