name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every CI job runs against MockProvider. No credentials, no network, no spend.
  TRUESTORY_MODE: mock
  TRUESTORY_LOG_LEVEL: warning

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests eval

      - name: Format check
        run: ruff format --check src tests eval

      - name: Typecheck
        run: mypy src/truestory
        continue-on-error: true

      - name: Test
        run: pytest -m "not live" --cov=truestory --cov-report=term-missing

  policy:
    name: policy and schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # The routing table is load bearing. A malformed rule silently downgrades
      # a CRITICAL subject, so it is validated as a first class CI gate.
      - name: Validate routing policy
        run: python -m truestory.policy.loader --validate

      - name: Validate Parallel output schemas
        run: python -m truestory.policy.loader --validate-schemas

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npm run build

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive
        continue-on-error: true
      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

  license:
    name: license present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Submission requirement: a complete, unmodified, auto detectable licence
      # at the repository root.
      - name: Assert LICENSE at root
        run: test -f LICENSE && wc -l LICENSE
