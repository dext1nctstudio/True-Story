# =============================================================================
# TRUE STORY  ·  adjudication rubric
# =============================================================================
# The deterministic post checks applied AFTER the model, never by it.
#
# The Adjudicator is a language model with forced function calling, so it can
# only emit a verdict together with evidence identifiers and a confidence. What
# it cannot do is decide when its own uncertainty is unacceptable. That is this
# file, and it runs as plain code over the model's output.
#
# Every threshold here is a product decision that a clearance attorney should
# be able to read, argue with, and change without touching Python.
# =============================================================================

version: 1
updated: "2026-08-12"

# -----------------------------------------------------------------------------
# confidence gates
# -----------------------------------------------------------------------------
confidence:
  # Below this, the machine does not get the last word.
  counsel_threshold: 0.75

  # A grounded fallback answer is worth having and must never present as equal
  # to a fully cited research run. Principle P5, degrade honestly.
  fallback_cap: 0.60

  # A CRITICAL subject that comes back clean still needs a human to agree
  # before it renders green in a document an underwriter will rely on.
  critical_clear_requires_human: true

  # Minimum citations before a verdict may be recorded at all, by tier.
  #
  # One good source settles most questions, and demanding two made the system
  # ask a lawyer to confirm things it had already answered correctly: on a
  # measured run it produced eighteen right verdicts and still sent twenty one
  # items for review. A reviewer who has to read everything has been saved
  # nothing, which is the paranoia engine this rubric exists to avoid.
  #
  # The exception below is not a hedge. A disparaging claim about someone
  # living is the one shape that is actually litigated, and it keeps the old
  # standard.
  min_citations:
    CRITICAL: 1
    HIGH: 1
    MEDIUM: 1
    LOW: 0
    NONE: 0

  # The shape every marquee case in this space takes. A negative assertion
  # about a living person keeps the two source standard for both citations and
  # independent domains, whatever the tier table above says.
  negative_living_min_citations: 2
  negative_living_min_domains: 2

  # A CONTRADICTED verdict is the most consequential thing this system says.
  # It requires a primary source, not a blog aggregating one.
  contradicted_requires_primary_source: true

  # ...and the source has to be one this system recognises as a record. Before
  # this flag, "primary" was whatever the research payload declared itself to
  # be, which in practice was every URL it returned. A red line now needs a
  # docket, a register, a statute, an official archive or a government record,
  # classified from the host in providers/source_quality.py.
  #
  # Applied where the stakes justify it, which is the whole point of a standard
  # of proof. A negative assertion about a living person is the claim that gets
  # filed on and it gets the strict rule. A sporting scoreline does not: there
  # is no docket for it, the register is the scorecard, and applying the strict
  # rule everywhere downgraded correct contradictions for want of a document
  # that could not exist.
  contradicted_requires_classified_primary: true
  strict_record_applies_to: negative_claims_about_living_people

  # The looser standard, used where a living person is at stake but the claim
  # is not disparaging. A contradiction still cannot rest on one forum post: it
  # needs a source that was quoted against the claim and either a second
  # independent domain or one recognised record.
  contradicted_minimum:
    attributed_sources: 1
    independent_domains: 2
    or_classified_primary: true

  # The third standard, for a claim with nobody behind it to injure: a date, a
  # scoreline, a place, an event that happened. The standard of proof should
  # scale with what is at stake in being wrong, and these three are not the
  # same risk:
  #
  #   "X was convicted of stalking"  — a living person, ruinous if wrong
  #   "X captained the side"         — a living person, embarrassing if wrong
  #   "Apollo 11 landed in 1972"     — a calendar year, wrong in a textbook
  #
  # Applying the middle standard to the third case cost a correct finding. The
  # run identified Apollo 11 against Wikidata, asked the right question, got
  # back that the claim is false, and then demoted it to unsupported because
  # only one page survived the attribution gate and Wikipedia classifies as
  # reference rather than record. A writer then reads "no record either way"
  # on a flatly false line and leaves it in the script.
  #
  # So an impersonal claim may be called false on a single recognised,
  # attributed, non user generated source. Everything protective stays: the
  # source still had to be quoted and verified, forums still cannot decide, and
  # the instant a living person is the subject the standards above take over.
  contradicted_minimum_impersonal:
    attributed_sources: 1
    independent_domains: 1
    or_classified_primary: true

  # No verdict of fact may rest on sources that were never shown to bear on the
  # claim. The attribution gate assigns a stance and a verbatim quote to every
  # source and verifies the quote is really in the retrieved text; anything
  # that fails is not evidence and never reaches this file.
  require_attributed_evidence: true

  # Corroboration, counted as distinct registrable domains rather than as
  # URLs. Five pages on one site are one source, and "corroborated by five
  # sources" is the most common lie a research pipeline tells its user.
  min_independent_domains:
    CRITICAL: 1
    HIGH: 1
    MEDIUM: 1
    LOW: 1
    NONE: 0

  # One recognised record may stand in for the second domain, exactly as it
  # already may for a contradiction above. Counting domains alone treats an
  # official scorecard and a content farm as one source each, so a claim the
  # record settles outright — "Dhoni scored 91 not out", on the scorecard —
  # was held back for want of a second site saying the same thing, and a
  # correct, cited, verified claim still went to a lawyer. Half of every run
  # was arriving in the counsel queue that way, which is the paranoia engine
  # this rubric exists to avoid: a reviewer who must read everything has been
  # saved nothing.
  #
  # Deliberately narrow. It substitutes for the domain count only, never for
  # attribution, never for the conflict rule, and never for the strict record
  # standard on a negative claim about a living person, which is the shape of
  # every case in this space and keeps its own harder rule below.
  recognised_record_substitutes_for_domain: true

  # Confidence may not exceed this once corroboration is taken into account.
  # A single tertiary source cannot produce a 0.95 verdict however certain the
  # model sounds: floor + span * corroboration_score is the ceiling.
  corroboration_cap_floor: 0.35
  corroboration_cap_span: 0.65

  # User generated and unattributable sources — forums, social, content farms —
  # may corroborate but may never carry a verdict on their own.
  low_trust_cannot_decide: true

  # A source older than this is flagged on a claim about a living person, where
  # the record moves. Not an escalation on its own; it is stated in the report.
  stale_source_days: 1825

# -----------------------------------------------------------------------------
# mandatory escalations
# -----------------------------------------------------------------------------
# These fire regardless of how confident the model was.
escalate_always:
  - id: contradicted_living_subject
    when: "verdict == 'CONTRADICTED' and subject_alive == true"
    action: NEEDS_COUNSEL
    reason: "A false factual claim about a living person. This is the claim that gets filed."

  - id: sources_conflict
    when: "evidence.conflict_detected == true"
    action: NEEDS_COUNSEL
    reason: "Sources disagree. Both are surfaced side by side and a human decides."

  - id: no_usable_evidence
    when: "evidence.usable_count == 0 and verdict != 'OPINION'"
    action: NEEDS_COUNSEL
    reason: "Research failed or returned nothing citable. Never guess in this position."

  - id: unverifiable_private_fact
    when: "verdict == 'UNVERIFIABLE' and subject.public_figure_status == 'private'"
    action: NEEDS_COUNSEL
    reason: "A private fact about a private person. Outside what public record research can settle."

  - id: record_disagreement
    when: "verdict != research_payload.verdict"
    action: NEEDS_COUNSEL
    reason: "The adjudicating model and its own research reached different conclusions."

  - id: not_corroborated
    when: "independent_domains < confidence.min_independent_domains[tier]"
    action: NEEDS_COUNSEL
    reason: "Single source. Nothing independent confirms it."

  - id: identifiability_hit
    when: "element_type == 'REAL_PERSON_IDENTIFIABLE' and findall.match_count > 0"
    action: NEEDS_COUNSEL
    reason: "The attribute cluster resolves to real people. The Baby Reindeer failure mode."

# -----------------------------------------------------------------------------
# the Fairstein rule
# -----------------------------------------------------------------------------
# When They See Us did not turn on one provably false line. It turned on a set
# of scenes attributing specific conduct to a named living person that the
# record could not support. Amber is not "probably fine", amber is the category
# that settles: not provably false, and therefore not defensible either.
#
# So the system escalates the PERSON, not just the line, once density crosses.
amber_density:
  enabled: true
  threshold: 0.30                 # share of researched claims that are amber
  min_claims: 4                   # below this the ratio is noise
  applies_to: named_living_persons
  action: NEEDS_COUNSEL
  surface_in_ui: true             # the per person meter in the overlay
  reason: "Unsupported conduct density about a named living person."

# -----------------------------------------------------------------------------
# verdict language
# -----------------------------------------------------------------------------
# The epistemics are load bearing. UNSUPPORTED is not FALSE. Collapsing that
# distinction would be exactly the careless assertion about a real person that
# this product exists to prevent, so the wording is fixed here and both the UI
# and the PDF read from it. Nobody gets to improvise it in a template.
language:
  VERIFIED:
    label: "Verified"
    ui: "Supported by the public record."
    report: "The public record supports this assertion as written."
    color: green
  UNSUPPORTED:
    label: "Unsupported"
    ui: "No record found either way. This is not a finding of falsity."
    report: "Research located no record supporting or contradicting this assertion. This is not a finding that the assertion is false."
    color: amber
  CONTRADICTED:
    label: "Contradicted"
    ui: "The record shows otherwise. See sources."
    report: "The public record contradicts this assertion. Contradicting sources are listed in the evidence appendix."
    color: red
  UNVERIFIABLE:
    label: "Unverifiable"
    ui: "A private fact with no public record. Counsel review."
    report: "This assertion concerns a matter with no public record and cannot be verified by open source research."
    color: amber
  OPINION:
    label: "Opinion"
    ui: "Not a factual assertion. Not researched."
    report: "Characterisation rather than a verifiable factual assertion. Not researched."
    color: grey

# -----------------------------------------------------------------------------
# element status language
# -----------------------------------------------------------------------------
status_language:
  CLEAR: "No exposure identified on the available record."
  CLEAR_WITH_CONDITIONS: "Usable subject to the conditions listed. Common for expressive use protected under the First Amendment."
  NOT_CLEAR: "Exposure identified. A remedy is proposed below."
  NEEDS_LICENSE: "Rights exist and must be licensed. Rights holder contacts are listed."
  NEEDS_COUNSEL: "Escalated to production counsel. The system declines to make this call."
  RESEARCH_FAILED: "Research did not complete. Counted against coverage quality on the front page."

# -----------------------------------------------------------------------------
# remedy loop
# -----------------------------------------------------------------------------
remedy:
  max_iterations: 3
  require_verified_before_presenting: true   # this is the whole point
  preserve_dramatic_function: true
  alternate_names_offered: 3                 # matched on syllables, period, phonetics
  exclude_failed_candidates: true

  # Encoded from the terms of an actual settlement: the fictionalisation
  # disclaimer was moved to the start of every episode. Position and prominence
  # were the negotiated remedy, so they are the recommendation shape here.
  disclaimer:
    default_position: "start of each episode, before the first scene"
    default_text: "Certain characters, incidents, locations, dialogue and names are fictionalised for dramatic purposes."
    trigger: "project.truth_claim_framing == true"

# -----------------------------------------------------------------------------
# coverage quality
# -----------------------------------------------------------------------------
# The report always states its own quality on the front page. An underwriter,
# and a judge, prefers a caveated report to a confident wrong one.
coverage:
  warn_if_fallback_rate_above: 0.10
  warn_if_research_failed_above: 0.02
  warn_if_budget_degraded: true
  warn_if_any_scene_skipped: true
  front_page_statement: true
